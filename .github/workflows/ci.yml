# Laminary CI. Owner: sre. Runbook: docs/ENVIRONMENTS.md (CI section).
#
# Rules for this file:
# - Third-party actions are pinned to a full commit SHA (tag in the trailing comment).
#   Bump them deliberately, never float on a moving tag.
# - No job here uses repository secrets. The repo is private on GitHub Free, so GitHub
#   Environments are unavailable and every workflow can read every repo secret. Deploys
#   and EAS builds go in separate workflows: prod ones are named deploy-prod*.yml, are
#   workflow_dispatch-only (a convention until Phase 3), and are the only files allowed
#   to reference PROD secrets (checked by the "prod-secret tripwire" step below; a
#   tripwire against accidental misuse, not access control).
# - CI is advisory: without branch protection nothing blocks a merge on a red run.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pipeline:
    name: pipeline (ruff + pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check --output-format=github .
      - name: Test (pytest)
        run: pytest

  app:
    name: app (Expo, runs once app/package.json exists)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect Expo project
        id: detect
        run: |
          if [ -f app/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=app job skipped::app/package.json not found; nothing to build yet."
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: "22"
      - name: Install
        if: steps.detect.outputs.present == 'true'
        working-directory: app
        run: npm ci
      - name: Lint
        if: steps.detect.outputs.present == 'true'
        working-directory: app
        run: npm run lint --if-present
      - name: Test
        if: steps.detect.outputs.present == 'true'
        working-directory: app
        run: npm test --if-present

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # gitleaks CLI (MIT). Run directly instead of gitleaks-action, which needs a
      # paid license key for repos owned by a GitHub organization.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan full history, not just the tip
      - name: Install gitleaks (checksum verified)
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
      - name: Scan git history
        run: ./gitleaks git --redact --verbose --exit-code 1 .
      - name: Prod-secret tripwire (not access control; see docs/ENVIRONMENTS.md)
        # Fails if a workflow other than deploy-prod*.yml reads a PROD secret, reads secrets
        # in bulk, or invokes a deploy-prod workflow. grep exit 1 = clean; >1 = fail closed.
        # Known limit: a text match. Deliberate evasion (string building, workflow IDs,
        # composite actions) is possible; this catches accidents only.
        run: |
          shopt -s nullglob
          files=()
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            case "${f##*/}" in deploy-prod*) ;; *) files+=("$f") ;; esac
          done
          [ ${#files[@]} -gt 0 ] || { echo "::error::no workflow files found; failing closed"; exit 2; }
          # [-] keeps this regex from matching its own source text.
          re='secrets\.[A-Za-z0-9_]*PROD|secrets\[|toJSON\(secrets\)|secrets:[[:space:]]*inherit|workflow[[:space:]]+run[[:space:]].*deploy[-]prod|workflows/deploy[-]prod'
          rc=0; hits=$(grep -liE "$re" "${files[@]}") || rc=$?
          if [ "$rc" -gt 1 ]; then echo "::error::tripwire grep failed (exit $rc); failing closed"; exit 2; fi
          if [ "$rc" -eq 0 ]; then
            while IFS= read -r f; do
              echo "::error file=$f::prod secret, bulk secret, or deploy-prod reference outside deploy-prod*.yml"
            done <<< "$hits"
            exit 1
          fi
          echo "OK: prod-secret tripwire clean (${#files[@]} workflow files checked)"
