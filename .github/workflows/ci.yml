# Laminary CI. Owner: sre. Runbook: docs/ENVIRONMENTS.md (CI section).
#
# Rules for this file:
# - Third-party actions are pinned to a full commit SHA (tag in the trailing comment).
#   Bump them deliberately, never float on a moving tag.
# - No job here uses repository secrets. The repo is private on GitHub Free, so GitHub
#   Environments are unavailable and every workflow can read every repo secret. Deploys
#   and EAS builds go in separate workflows: prod ones are named deploy-prod*.yml, are
#   workflow_dispatch-only, and are the only files allowed to reference *_PROD secrets
#   (checked by the "prod-secret tripwire" step below; a tripwire against
#   accidental misuse, not access control).
# - CI is advisory: without branch protection nothing blocks a merge on a red run.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pipeline:
    name: pipeline (ruff + pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check --output-format=github .
      - name: Test (pytest)
        run: pytest

  app:
    name: app (Expo, runs once app/package.json exists)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect Expo project
        id: detect
        run: |
          if [ -f app/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=app job skipped::app/package.json not found; nothing to build yet."
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: "22"
      - name: Install
        if: steps.detect.outputs.present == 'true'
        working-directory: app
        run: npm ci
      - name: Lint
        if: steps.detect.outputs.present == 'true'
        working-directory: app
        run: npm run lint --if-present
      - name: Test
        if: steps.detect.outputs.present == 'true'
        working-directory: app
        run: npm test --if-present

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # gitleaks CLI (MIT). Run directly instead of gitleaks-action, which needs a
      # paid license key for repos owned by a GitHub organization.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan full history, not just the tip
      - name: Install gitleaks (checksum verified)
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
      - name: Scan git history
        run: ./gitleaks git --redact --verbose --exit-code 1 .
      - name: Prod-secret tripwire (not access control; see docs/ENVIRONMENTS.md)
        # Non-deploy-prod workflows must not touch *_PROD or bulk secrets; deploy-prod*
        # workflows must be workflow_dispatch-only. grep exit 1 = clean, >1 = fail closed.
        run: |
          shopt -s nullglob
          wf=(.github/workflows/*.yml .github/workflows/*.yaml); prod=(); other=(); fail=0
          [ ${#wf[@]} -gt 0 ] || { echo "::error::no workflow files found; failing closed"; exit 2; }
          for f in "${wf[@]}"; do case "${f##*/}" in deploy-prod*) prod+=("$f") ;; *) other+=("$f") ;; esac; done
          check() { # $1 message, $2 regex, rest files
            local msg=$1 re=$2 rc=0 hits f; shift 2
            [ $# -gt 0 ] || return 0
            hits=$(grep -liE "$re" "$@") || rc=$?
            if [ "$rc" -gt 1 ]; then echo "::error::guard grep failed (exit $rc); failing closed"; exit 2; fi
            while IFS= read -r f; do [ -z "$f" ] || { echo "::error file=$f::$msg"; fail=1; }; done <<< "$hits"
          }
          check "prod or bulk secret access outside deploy-prod*.yml" \
            'secrets\.[A-Za-z0-9_]+_PROD\b|secrets\[|toJSON\(secrets\)|secrets:[[:space:]]*inherit' "${other[@]}"
          # Trigger positions only (key, `on:` line, list item), so `run: supabase db push` passes.
          t='(push|pull_request[a-z_]*|schedule|workflow_call|workflow_run|repository_dispatch)'
          check "deploy-prod workflow has a trigger other than workflow_dispatch" \
            "(^|[[:space:]])$t:|^[\"']?on[\"']?:.*\\b$t\\b|^[[:space:]]*-[[:space:]]*$t[[:space:]]*\$" "${prod[@]}"
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "OK: prod-secret tripwire clean (${#other[@]} other, ${#prod[@]} deploy-prod workflows)"
